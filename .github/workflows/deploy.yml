
name: LAB12 Storage CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target Azure environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Setup Azure CLI
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      target: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
