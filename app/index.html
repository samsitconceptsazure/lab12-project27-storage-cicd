<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SamsITConcepts StorageOps</title><style>body{font:16px system-ui;background:#081a30;color:#e9f7ff;margin:0}header{background:#0c3154;padding:24px}main{max-width:900px;margin:40px auto;padding:20px}.card{background:#123657;padding:25px;border-radius:14px;margin:20px 0}code{color:#54e5e5}a{color:#54e5e5}</style></head><body><header><h1>SamsITConcepts | StorageOps</h1><p>Enterprise Storage Deployment Portal</p></header><main><div class="card"><h2>Environment: <span id="env">loading</span></h2><p>Infrastructure deployed with Azure Bicep and GitHub Actions.</p><p>Static frontend hosted by Azure Storage.</p></div><div class="card"><h2>Deployment details</h2><pre id="meta"></pre></div><div class="card"><h2>Health</h2><p id="health">Checking deployment manifest...</p></div></main><script>fetch('deployment.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Manifest missing');return r.json()}).then(d=>{document.querySelector('#env').textContent=d.environment;document.querySelector('#meta').textContent=JSON.stringify(d,null,2);document.querySelector('#health').textContent='PASS — deployment manifest available'}).catch(e=>{document.querySelector('#health').textContent='FAIL — '+e.message})</script></body></html>
